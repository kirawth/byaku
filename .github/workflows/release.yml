name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  # npm trusted publishing: the job proves who it is with an OIDC token, no npm secret needed
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10
      - run: npm install -g npm@11
      - run: npm ci
      # With pending changesets this opens a "Version packages" pull request;
      # once that is merged, it publishes the new version to npm with provenance.
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          title: Version packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
