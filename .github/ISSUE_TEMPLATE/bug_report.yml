name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you typed, what Byaku replied, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal setup (Byaku options, bot prefix) and the steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Byaku, Seyfert and Node.js versions, and the OS.
      placeholder: byaku 1.0.0, seyfert 5.2.0, Node 22.11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens and other secrets first.
